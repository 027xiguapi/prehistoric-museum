name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch at a time: a newer push cancels the in-flight build.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 and AGP 8.x both require a JDK 21 toolchain.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Provides cmdline-tools and accepts SDK licenses; Gradle then downloads
      # the exact platform/build-tools versions the project declares.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Caches the Gradle distribution and build outputs across runs. The
      # Android project lives in `android/`, not the repository root.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Install dependencies
        run: npm ci

      # Static-export the Next.js app into `out/` and drop the remote animal
      # assets (models/audio are fetched on demand from NEXT_PUBLIC_ASSET_ORIGIN).
      - name: Build web bundle
        run: npm run build:mobile

      # Copies `out/` into the Android webview assets and refreshes plugins.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WonZoo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
